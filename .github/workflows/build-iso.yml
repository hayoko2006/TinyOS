name: 构建 TinyOS ISO

# 云端构建：在 GitHub 托管的 Ubuntu 跑者内启动 Debian 13 容器，
# 用 live-build 产出 iso-hybrid 镜像，随后做离线内容断言 + QEMU 启动冒烟测试。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（TINYOS_VERSION）
        required: false
        default: "1.0.0"
      edition:
        description: 发行口味（TINYOS_EDITION，与 Debian 基座代号解耦）
        required: false
        default: "whuang"
  push:
    branches: [main]
    paths:
      - "tynos/**"
      - ".github/workflows/build-iso.yml"

concurrency:
  group: tinyos-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 启动测试证据需回写仓库

jobs:
  build-and-test:
    name: 构建 + 启动测试
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      VERSION: ${{ inputs.version || '1.0.0' }}
      EDITION: ${{ inputs.edition || 'whuang' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf --one-file-system \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/powershell /opt/az /opt/microsoft /usr/local/lib/node_modules \
            /usr/local/share/chromium /opt/google || true
          sudo apt-get clean
          df -h /

      - name: 构建 ISO（Debian 13 容器）
        timeout-minutes: 300
        run: |
          # 确保脚本可执行：经 GitHub MCP / 网页编辑等途径修改文件会丢失 exec 位，
          # 导致容器内 `./build.sh` 报 Permission denied（exit 126）
          chmod +x tynos/build.sh tynos/tools/gen-assets.py tools/join-iso.sh
          mkdir -p out
          docker run --privileged --rm \
            -v "$PWD:/work" \
            -w /work/tynos \
            -e TINYOS_VERSION="$VERSION" \
            -e TINYOS_EDITION="$EDITION" \
            -e TINYOS_OUT_DIR=/work/out \
            -e TINYOS_MIN_FREE_MB=18000 \
            -e TINYOS_MIRROR_CHROOT=https://deb.debian.org/debian/ \
            -e TINYOS_MIRROR_BINARY=https://deb.debian.org/debian/ \
            -e TINYOS_MIRROR_SECURITY=https://security.debian.org/debian-security/ \
            debian:13 bash -lc './build.sh'

      - name: 失败时输出构建日志
        if: failure()
        run: tail -n 300 out/build.log 2>/dev/null || echo "无构建日志"

      - name: 校验镜像与校验和
        run: |
          set -eux
          ls -lh out/
          cd out
          sha256sum -c ./*.sha256
          file ./*.iso
          xxd -l 512 ./*.iso | head -5

      - name: 离线校验镜像内容（需求对照）
        run: |
          set -e
          ISO=$(ls out/*.iso | head -1)
          mkdir -p mnt
          sudo mount -o loop,ro "$ISO" mnt
          echo "== ISO 顶层 =="; ls mnt
          echo "== /live =="; ls -lh mnt/live
          sudo unsquashfs -l mnt/live/filesystem.squashfs > sq.list
          echo "== GRUB 配置核对（品牌化 / 主题 / 自动引导）=="
          {
            echo "### /boot/grub/config.cfg（超时与主题来源）"
            sudo cat mnt/boot/grub/config.cfg 2>/dev/null || echo "(缺失)"
            echo ""
            echo "### /boot/grub/grub.cfg 关键行"
            sudo grep -nE 'set (theme|timeout|timeout_style|default)=|menuentry' mnt/boot/grub/grub.cfg 2>/dev/null || true
            echo ""
            echo "### /boot/grub/grub.cfg 前 30 行"
            sudo head -30 mnt/boot/grub/grub.cfg 2>/dev/null || true
            echo ""
            echo "### 引导器目录"
            sudo ls -l mnt/boot/grub/ 2>/dev/null || true
            sudo ls -l mnt/boot/grub/themes/tinyos/ 2>/dev/null || true
            sudo ls -ld mnt/isolinux mnt/EFI 2>/dev/null || true
          } > docs/evidence/iso-grub.txt
          sudo umount mnt
          echo "== 关键组件断言 =="
          FAILED=0
          check() {
            if grep -qF "$1" sq.list; then echo "  [OK]   $1"; else echo "  [MISS] $1"; FAILED=1; fi
          }
          # 需求 2：美化套件
          check 'usr/share/plasma/look-and-feel/com.tinyos.dark/'
          check 'usr/share/plasma/look-and-feel/com.tinyos.light/'
          check 'usr/share/plasma/look-and-feel/com.tinyos.aurora/'
          check 'usr/share/color-schemes/TinyOSDark.colors'
          check 'usr/share/color-schemes/TinyOSAurora.colors'
          check 'usr/share/wallpapers/TinyOS-Dark/contents/images/1920x1080.png'
          check 'usr/share/plymouth/themes/tinyos/tinyos.plymouth'
          check 'usr/share/sddm/themes/tinyos/theme.conf'
          check 'usr/local/bin/tinyos-theme'
          check 'usr/share/applications/tinyos-theme-dark.desktop'
          # 需求 3：兼容层
          check 'usr/local/bin/tinyos-wine'
          check 'usr/local/bin/tinyos-waydroid'
          check 'var/lib/waydroid/images/system.img'
          # 需求 4：镜像源工具
          check 'usr/local/bin/tinyos-mirror'
          # 需求 1/5：基座、裁剪与品牌化
          check 'etc/tinyos-edition'
          check 'usr/share/tinyos/build-info'
          check 'etc/apt/apt.conf.d/99tinyos'
          [ "$FAILED" = "0" ] || { echo "存在缺失项，失败退出"; exit 1; }

      - name: 安装 QEMU 与取证工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils socat imagemagick squashfs-tools
          if [ -w /dev/kvm ]; then echo "KVM 可用（硬件加速）"; else echo "KVM 不可用，使用软件模拟"; fi

      - name: QEMU 启动冒烟测试（截图取证）
        id: boot
        continue-on-error: true
        run: |
          mkdir -p evidence
          # 完整输出落盘归档，便于无凭据环境下排查截图环节问题
          exec > >(tee evidence/boot-test.log) 2>&1
          set -x
          ISO=$(ls out/*.iso | head -1)
          ACCEL=""
          [ -w /dev/kvm ] && ACCEL="-enable-kvm -cpu host"
          # shellcheck disable=SC2086
          # 注意：-daemonize 会把 QEMU 的工作目录切到 /，
          # 因此 socket/serial/cdrom/screendump 必须使用绝对路径
          qemu-system-x86_64 $ACCEL -m 4096 -smp 2 \
            -device virtio-vga -display none \
            -cdrom "$PWD/$ISO" -boot d \
            -vnc 127.0.0.1:1 \
            -monitor unix:"$PWD/mon.sock",server,nowait \
            -serial file:"$PWD/evidence/serial.log" \
            -no-reboot -daemonize
          shot() { echo "screendump $PWD/evidence/$1.ppm" | socat - UNIX-CONNECT:"$PWD/mon.sock" \
                     || echo "[warn] screendump $1 失败"; }
          sleep 45;  shot 01-grub
          sleep 75;  shot 02-kernel
          sleep 90;  shot 03-login
          sleep 150; shot 04-desktop
          echo "info status" | socat - UNIX-CONNECT:"$PWD/mon.sock" > evidence/qemu-status.txt \
            || echo "[warn] qemu status 查询失败"
          for f in evidence/*.ppm; do
            [ -e "$f" ] || { echo "[warn] 未产生任何 ppm 截图"; break; }
            convert "$f" "${f%.ppm}.png" || echo "[warn] convert 失败: $f"
          done
          pkill -f qemu-system-x86_64 || true
          ls -lh evidence/

      - name: 归档测试证据到仓库
        if: always()
        run: |
          mkdir -p docs/evidence
          cp -f evidence/*.png evidence/*.log evidence/*.txt docs/evidence/ 2>/dev/null || true
          # 无论失败在哪一步，都归档构建日志的关键片段，便于无凭据排错
          {
            echo "### out/ 目录"
            ls -la out/ 2>/dev/null || echo "(out 不存在)"
            echo ""
            echo "### 磁盘占用"
            df -h / 2>/dev/null || true
            echo ""
            echo "### 日志中的错误行"
            grep -nE '^E: |^E$|error|Error|ERROR|failed|Failed|Permission denied|No space|Killed|oom|Out of memory|not found|timed out' out/build.log 2>/dev/null | tail -80 || echo "(无 out/build.log)"
            echo ""
            echo "### 日志首 60 行"
            head -60 out/build.log 2>/dev/null || echo "(无 out/build.log —— build.sh 可能未执行)"
            echo ""
            echo "### 日志末 400 行"
            tail -400 out/build.log 2>/dev/null || true
          } > docs/evidence/build-tail.log
          grep -E 'usr/local/bin/|usr/share/plasma/look-and-feel/com\.tinyos|usr/share/plymouth/themes/tinyos|var/lib/waydroid/images|usr/share/wallpapers/TinyOS|usr/share/tinyos/' sq.list 2>/dev/null \
            | head -80 > docs/evidence/squashfs-keyfiles.txt || true
          ls -lh docs/evidence/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/evidence
          if git diff --cached --quiet; then
            echo "无新证据需要归档"
          else
            git commit -m "ci: 归档 ISO 构建与启动测试证据 [skip ci]"
            git push
          fi

      - name: 分卷（ISO > 2GB 时，便于下载与二次分发）
        run: |
          cd out
          ISO=$(ls *.iso | head -1)
          if [ "$(stat -c%s "$ISO")" -gt 2000000000 ]; then
            split -b 1900M -d -a 2 "$ISO" "${ISO}.part-"
            ls -lh
          else
            echo "ISO 小于 2GB，无需分卷"
          fi

      - name: 上传 ISO（完整文件）
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tinyos-iso
          path: |
            out/*.iso
            out/*.iso.sha256
            out/build.log
          compression-level: 0
          retention-days: 30

      - name: 上传 ISO 分卷
        uses: actions/upload-artifact@v4
        with:
          name: tinyos-iso-parts
          path: out/*.part-*
          compression-level: 0
          retention-days: 30
          if-no-files-found: ignore

      - name: 上传测试证据
        uses: actions/upload-artifact@v4
        with:
          name: tinyos-evidence
          path: docs/evidence/
          retention-days: 30
          if-no-files-found: ignore

      - name: 发布到 GitHub Releases
        id: release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="v${VERSION}"
          ISO=$(ls out/*.iso | head -1)
          NAME=$(basename "$ISO")
          EXTRA=""
          # GitHub Release 单个资产上限 2GB，ISO 超过上限时改以分卷发布
          if [ "$(stat -c%s "$ISO")" -gt 2000000000 ]; then
            ASSETS=$(ls out/*.part-*)
            N=$(ls out/*.part-* | wc -l)
            EXTRA="tools/join-iso.sh tools/join-iso.ps1"
            NOTE=$(printf '%s\n' \
              "### 下载与合并（2 步）" \
              "" \
              "1. 把下方 Assets 里的**全部文件**下载到同一目录（${N} 个分卷 + 1 个 .sha256 + 2 个合并脚本）；" \
              "2. 合并并自动校验 SHA256：" \
              "" \
              "Linux / macOS：" \
              "" \
              "    bash join-iso.sh ${NAME}" \
              "" \
              "Windows PowerShell：" \
              "" \
              "    .\\join-iso.ps1 -Prefix ${NAME}" \
              "" \
              "合并后得到 ${NAME}（$(du -h "$ISO" | cut -f1)），可直接写盘或用虚拟机启动。" \
              "" \
              "> 说明：GitHub Release 单个资产上限 2 GiB，完整 ISO 超出该限制，故以分卷分发。")
          else
            ASSETS="$ISO"
            NOTE="直接下载下方 ISO 即可。"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，更新说明与资产"
            gh release edit "$TAG" --title "TinyOS ${VERSION} (${EDITION})" --notes "$NOTE"
          else
            gh release create "$TAG" --title "TinyOS ${VERSION} (${EDITION})" --notes "$NOTE"
          fi
          gh release upload "$TAG" $ASSETS out/*.sha256 $EXTRA --clobber
          gh release view "$TAG" --json url --jq .url

      - name: 汇总
        if: always()
        run: |
          {
            echo "## TinyOS ${VERSION} (${EDITION}) 构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            if ls out/*.iso >/dev/null 2>&1; then
              ISO=$(ls out/*.iso | head -1)
              echo "| ISO | \`$(basename "$ISO")\` |"
              echo "| 大小 | $(du -h "$ISO" | cut -f1) |"
              echo "| SHA256 | \`$(cut -d' ' -f1 "out/$(basename "$ISO").sha256")\` |"
            else
              echo "| ISO | 未生成 |"
            fi
            echo "| 启动测试 | ${{ steps.boot.outcome }} |"
            if [ "${{ steps.release.outcome }}" = "success" ]; then
              echo "| Release | [v${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}) |"
            else
              echo "| Release | ${{ steps.release.outcome }} |"
            fi
            echo "| Runner | ${RUNNER_OS} / KVM $( [ -w /dev/kvm ] && echo 可用 || echo 不可用 ) |"
          } >> "$GITHUB_STEP_SUMMARY"
